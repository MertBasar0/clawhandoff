<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="-20 -20 160 160" role="img">
  <metadata>MIT License - Copyright (c) 2026 Mert Basar</metadata>
  <title>Bridge Conductor Blobster</title>
  <desc>A coral-orange Blobster in a deep-navy dispatcher jacket with cyan trim and a gold Git verification badge, holding a glowing twin-node relay baton.</desc>
  <defs>
    <clipPath id="blobster-body-clip">
      <path d="M60 8 C32 8 16 32 16 52 C16 72 30 90 44 95 L44 104 L54 104 L54 96 C58 97.5 62 97.5 66 96 L66 104 L76 104 L76 95 C90 90 104 72 104 52 C104 32 88 8 60 8 Z"/>
    </clipPath>
  </defs>
  <!-- Antennae with glowing cyan signal tips -->
  <g stroke="#F28A43" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M46 14 Q38 4 31 7"/>
    <path d="M74 14 Q82 4 89 7"/>
  </g>
  <circle cx="30" cy="7" r="3.2" fill="#38BDF8" stroke="#0F2942" stroke-width="1.5"/>
  <circle cx="90" cy="7" r="3.2" fill="#38BDF8" stroke="#0F2942" stroke-width="1.5"/>

  <!-- Left claw holding a mini commit scroll/clipboard -->
  <g transform="rotate(-10 10 52)">
    <rect x="-4" y="34" width="18" height="24" rx="3" fill="#FFF7ED" stroke="#16324F" stroke-width="2.5"/>
    <line x1="0" y1="41" x2="10" y2="41" stroke="#0EA5E9" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="46" x2="10" y2="46" stroke="#64748B" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M1 52 L4 55 L10 49" fill="none" stroke="#10B981" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <path d="M20 42 C5 37 0 47 5 57 C10 67 20 62 25 52 C28 45 25 42 20 42 Z" fill="#CE632E"/>

  <!-- Right claw & Twin-Node Relay Baton (A2A / Handoff Bridge) -->
  <g transform="rotate(14 114 54)">
    <rect x="111" y="22" width="8" height="58" rx="4" fill="#16324F" stroke="#0B1B2B" stroke-width="2.5"/>
    <rect x="112.5" y="38" width="5" height="22" rx="2" fill="#38BDF8"/>
    <!-- Top & bottom connected Git/Agent nodes -->
    <circle cx="115" cy="18" r="8.5" fill="#38BDF8" stroke="#0F2942" stroke-width="2.8"/>
    <circle cx="115" cy="18" r="3.2" fill="#FFFBEB"/>
    <circle cx="115" cy="82" r="6.5" fill="#FBBF24" stroke="#0F2942" stroke-width="2.5"/>
    <circle cx="115" cy="82" r="2.3" fill="#0F2942"/>
  </g>
  <path d="M100 42 C115 37 120 47 115 57 C110 67 100 62 95 52 C92 45 95 42 100 42 Z" fill="#CE632E"/>

  <!-- Canonical Blobster Body -->
  <path d="M60 8 C32 8 16 32 16 52 C16 72 30 90 44 95 L44 104 L54 104 L54 96 C58 97.5 62 97.5 66 96 L66 104 L76 104 L76 95 C90 90 104 72 104 52 C104 32 88 8 60 8 Z" fill="#F28A43"/>

  <!-- Dispatcher / Conductor Coat clipped to Blobster body -->
  <g clip-path="url(#blobster-body-clip)">
    <!-- Navy coat base -->
    <path d="M14 50 L44 45 L60 58 L76 45 L106 50 L106 106 L14 106 Z" fill="#16324F"/>
    <!-- Lapels -->
    <polygon points="44,45 60,58 49,68 35,51" fill="#234B73"/>
    <polygon points="76,45 60,58 71,68 85,51" fill="#234B73"/>
    <!-- Cyan bridge piping -->
    <path d="M44 45 L60 58 L76 45" fill="none" stroke="#38BDF8" stroke-width="2.4" stroke-linejoin="round"/>
    <line x1="60" y1="58" x2="60" y2="96" stroke="#0B1B2B" stroke-width="2.6"/>
    <!-- Brass buttons -->
    <circle cx="54" cy="73" r="2.4" fill="#FBBF24"/>
    <circle cx="54" cy="83" r="2.4" fill="#FBBF24"/>
    <!-- Hem shadow -->
    <rect x="16" y="94" width="88" height="12" fill="#0E2238"/>
    <!-- Gold Gatekeeper Shield Badge on right chest -->
    <path d="M72 67 L84 67 L84 76 C84 81 78 85 78 85 C78 85 72 81 72 76 Z" fill="#FBBF24" stroke="#0B1B2B" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M75.2 75.2 L77.3 77.4 L81.2 72.8" fill="none" stroke="#0B1B2B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Forehead shine & Eyes -->
  <ellipse cx="48" cy="28" rx="20" ry="11" fill="#ffffff" opacity="0.12"/>
  <g>
    <circle cx="45" cy="32" r="5.6" fill="#0A1014"/>
    <circle cx="75" cy="32" r="5.6" fill="#0A1014"/>
    <circle cx="46.6" cy="30.4" r="2.2" fill="#FFEDD2"/>
    <circle cx="76.6" cy="30.4" r="2.2" fill="#FFEDD2"/>
  </g>
</svg>

