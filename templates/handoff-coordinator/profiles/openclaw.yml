schemaVersion: 1
agent:
  tools:
    profile: full
    allow:
      - read
      - write
      - edit
      - apply_patch
      - exec
      - process
      - session_status
      - clawhandoff__bridge_preflight
      - clawhandoff__bridge_handoff_start
      - clawhandoff__bridge_handoff_attach
      - clawhandoff__bridge_handoff_continue
      - clawhandoff__bridge_verify_git
      - clawhandoff__bridge_handoff_abort
    fs:
      workspaceOnly: true
